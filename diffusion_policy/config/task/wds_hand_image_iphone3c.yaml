name: wds_hand_image
camera_mode: single

image_shape: &image_shape [3, 240, 320]

shape_meta: &shape_meta
  obs:
    image:
      shape: *image_shape
      type: rgb
    state:
      shape: [48]
      type: low_dim
  action:
    shape: [48]

train_wds_datasets: &train_wds_datasets
  - name: iphone3c
    shard_urls: /share_data/hetianjia/real_world_a2d/iphone_3c/train/shard-*.tar
  # - name: grab_milk_dragon_train
  #   shard_urls: /share_data/yeyuyao/grab_milk_dragon/train/shard-*.tar

val_wds_datasets: &val_wds_datasets
  - name: iphone3c_val
    shard_urls: /share_data/hetianjia/real_world_a2d/iphone_3c/val/shard-*.tar
  # - name: grab_milk_dragon_val
  #   shard_urls: /share_data/yeyuyao/grab_milk_dragon/val/shard-*.tar

dataset:
  _target_: diffusion_policy.dataset.wds_hand_image_dataset.WdsHandImageDataset
  shape_meta: *shape_meta
  train_wds_datasets: *train_wds_datasets
  val_wds_datasets: *val_wds_datasets
  horizon: ${horizon}
  n_obs_steps: ${dataset_obs_steps}
  image_stride: 30
  state_stride: 30
  action_stride: 1
  history_pad_mode: repeat
  action_pad_mode: repeat
  shuffle_buffer: 16384
  shuffle_initial: 4096
  keep_ratio: 0.2
  camera_mode: ${task.camera_mode}
  use_relative_action: True
  normalizer_cache_path: data/wds/cache/wds_hand_normalizer.pt
  normalizer_cache_mode: auto
  normalizer_wds_datasets: *train_wds_datasets
  normalizer_max_rows: 100000
  normalizer_match_egovla_rot6d: True
